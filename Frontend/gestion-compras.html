<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Compras - Sistema Ferretería</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- SweetAlert2 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <!-- Custom CSS -->
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js"></script>
  </head>
  <body>
    <div id="wrapper">
      <!-- Sidebar (Cargado dinámicamente) -->
      <div id="sidebar-container"></div>

      <!-- Page Content -->
      <div id="page-content-wrapper">
        <div class="container-fluid content-offset">
          <main>
            <h1 class="mt-1 mb-3">Historial de Compras</h1>

            <div class="card shadow-sm mb-3">
              <div class="card-header bg-dark text-white">
                Buscar Compras (Proveedor o Factura)
              </div>
              <div class="card-body">
                <div class="input-group">
                  <span class="input-group-text"
                    ><i class="fas fa-search"></i
                  ></span>
                  <input
                    type="text"
                    class="form-control"
                    id="searchPurchaseInput"
                    placeholder="Nombre del proveedor o Nro de Factura"
                  />
                  <button
                    class="btn btn-warning"
                    type="button"
                    onclick="cargarHistorial()"
                  >
                    <i class="fas fa-sync-alt"></i> Actualizar
                  </button>
                  <button
                    class="btn btn-success"
                    type="button"
                    onclick="exportarExcel()"
                  >
                    <i class="fas fa-file-excel"></i> Exportar Excel
                  </button>
                </div>
              </div>
            </div>

            <div class="card shadow-sm">
              <div class="card-header bg-warning text-dark fw-bold">
                Listado de Compras Realizadas
              </div>
              <div class="card-body">
                <div id="loadingSpinner" class="text-center my-3 d-none">
                  <div class="spinner-border text-warning" role="status">
                    <span class="visually-hidden">Cargando...</span>
                  </div>
                </div>

                <div class="table-responsive">
                  <table class="table table-hover table-striped">
                    <thead class="table-dark">
                      <tr>
                        <th>N° Control</th>
                        <th>Fecha</th>
                        <th>Proveedor</th>
                        <th>N° Factura</th>
                        <th>Total ($)</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="comprasTableBody">
                      <!-- Las filas se insertarán aquí dinámicamente -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS -->
    <script src="sidebar.js"></script>
    <script src="gestion-compras.js"></script>
  </body>
</html>
