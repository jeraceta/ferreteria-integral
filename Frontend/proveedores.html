<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Proveedores - Ferretería</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome CSS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <!-- SweetAlert2 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <!-- Custom CSS -->
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js"></script>
  </head>
  <body class="bg-light">
    <div id="wrapper">
      <!-- Sidebar (Cargado dinámicamente) -->
      <div id="sidebar-container"></div>

      <!-- Page Content -->
      <div id="page-content-wrapper">
        <div class="container-fluid content-offset">
          <main>
            <h1 class="mb-4 text-center">Gestión de Proveedores</h1>

            <div class="card shadow-sm mb-4">
              <div
                class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
              >
                <h5 class="mb-0">Listado de Proveedores</h5>
                <div>
                  <button
                    type="button"
                    class="btn btn-light btn-sm me-2"
                    id="btnReporteProveedores"
                  >
                    <i class="fas fa-file-pdf me-2"></i>Reporte PDF
                  </button>
                  <button
                    class="btn btn-warning btn-sm me-2"
                    type="button"
                    onclick="cargarProveedores()"
                  >
                    <i class="fas fa-sync-alt me-2"></i> Actualizar
                  </button>
                  <button
                    class="btn btn-success btn-sm me-2"
                    type="button"
                    onclick="abrirModalReporte()"
                  >
                    <i class="fas fa-file-excel me-2"></i> Exportar Excel
                  </button>
                  <button
                    type="button"
                    class="btn btn-light btn-sm"
                    id="btnNuevoProveedor"
                  >
                    <i class="fas fa-plus me-2"></i>Nuevo Proveedor
                  </button>
                </div>
              </div>
              <div class="card-body">
                <div class="mb-3">
                  <input
                    type="text"
                    class="form-control"
                    id="inputBuscarProveedor"
                    placeholder="Buscar por Razón Social, RIF o Contacto..."
                  />
                </div>
                <div class="table-responsive">
                  <table class="table table-hover table-striped align-middle">
                    <thead class="table-dark">
                      <tr>
                        <th>RIF</th>
                        <th>Razón Social</th>
                        <th>Persona Contacto</th>
                        <th>Teléfono</th>
                        <th>Email</th>
                        <th class="text-center">Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="tablaProveedores">
                      <!-- Aquí se cargarán los proveedores -->
                      <tr>
                        <td colspan="6" class="text-center">
                          Cargando proveedores...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Modal Proveedor -->
            <div
              class="modal fade"
              id="modalProveedor"
              tabindex="-1"
              aria-labelledby="modalProveedorLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog modal-lg">
                <div class="modal-content">
                  <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="modalProveedorLabel">
                      Registrar Proveedor
                    </h5>
                    <button
                      type="button"
                      class="btn-close btn-close-white"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form id="formProveedor" autocomplete="off">
                      <input type="hidden" id="proveedorId" />

                      <div class="row mb-3">
                        <div class="col-md-4">
                          <label for="rifProveedor" class="form-label"
                            >RIF</label
                          >
                          <input
                            type="text"
                            class="form-control"
                            id="rifProveedor"
                            required
                            placeholder="Ej: J-12345678-9"
                          />
                        </div>
                        <div class="col-md-8">
                          <label for="razonSocialProveedor" class="form-label"
                            >Razón Social</label
                          >
                          <input
                            type="text"
                            class="form-control"
                            id="razonSocialProveedor"
                            required
                            placeholder="Ej: Distribuidora Ferretera, C.A."
                          />
                        </div>
                      </div>

                      <div class="mb-3">
                        <label for="personaContacto" class="form-label"
                          >Persona de Contacto</label
                        >
                        <input
                          type="text"
                          class="form-control"
                          id="personaContacto"
                          placeholder="Ej: Juan Pérez"
                        />
                      </div>

                      <div class="row mb-3">
                        <div class="col-md-6">
                          <label for="telefonoProveedor" class="form-label"
                            >Teléfono</label
                          >
                          <input
                            type="tel"
                            class="form-control"
                            id="telefonoProveedor"
                            placeholder="Ej: 0414-1234567"
                          />
                        </div>
                        <div class="col-md-6">
                          <label for="emailProveedor" class="form-label"
                            >Correo Electrónico</label
                          >
                          <input
                            type="email"
                            class="form-control"
                            id="emailProveedor"
                            placeholder="Ej: ventas@proveedor.com"
                          />
                        </div>
                      </div>

                      <div class="mb-3">
                        <label for="direccionFiscalProveedor" class="form-label"
                          >Dirección Fiscal</label
                        >
                        <textarea
                          class="form-control"
                          id="direccionFiscalProveedor"
                          rows="2"
                          placeholder="Dirección completa"
                        ></textarea>
                      </div>

                      <div class="modal-footer px-0 pb-0">
                        <button
                          type="button"
                          class="btn btn-secondary"
                          data-bs-dismiss="modal"
                        >
                          Cancelar
                        </button>
                        <button type="submit" class="btn btn-primary">
                          Guardar Proveedor
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>

            <!-- Modal Configuración de Reporte -->
            <div
              class="modal fade"
              id="modalReporteConfig"
              tabindex="-1"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header bg-secondary text-white">
                    <h5 class="modal-title">
                      <i class="fas fa-cogs me-2"></i>Configuración de Reporte
                    </h5>
                    <button
                      type="button"
                      class="btn-close btn-close-white"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form id="formReporteConfig">
                      <h6 class="mb-3 border-bottom pb-2">
                        Columnas a Incluir
                      </h6>
                      <div class="row g-2 mb-4">
                        <div class="col-6">
                          <div class="form-check">
                            <input
                              class="form-check-input col-check"
                              type="checkbox"
                              value="rif"
                              id="colRif"
                              checked
                            /><label class="form-check-label" for="colRif"
                              >RIF</label
                            >
                          </div>
                        </div>
                        <div class="col-6">
                          <div class="form-check">
                            <input
                              class="form-check-input col-check"
                              type="checkbox"
                              value="razon_social"
                              id="colNombre"
                              checked
                            /><label class="form-check-label" for="colNombre"
                              >Razón Social</label
                            >
                          </div>
                        </div>
                        <div class="col-6">
                          <div class="form-check">
                            <input
                              class="form-check-input col-check"
                              type="checkbox"
                              value="persona_contacto"
                              id="colContacto"
                              checked
                            /><label class="form-check-label" for="colContacto"
                              >Contacto</label
                            >
                          </div>
                        </div>
                        <div class="col-6">
                          <div class="form-check">
                            <input
                              class="form-check-input col-check"
                              type="checkbox"
                              value="telefono"
                              id="colTel"
                              checked
                            /><label class="form-check-label" for="colTel"
                              >Teléfono</label
                            >
                          </div>
                        </div>
                        <div class="col-6">
                          <div class="form-check">
                            <input
                              class="form-check-input col-check"
                              type="checkbox"
                              value="email"
                              id="colEmail"
                              checked
                            /><label class="form-check-label" for="colEmail"
                              >Email</label
                            >
                          </div>
                        </div>
                        <div class="col-6">
                          <div class="form-check">
                            <input
                              class="form-check-input col-check"
                              type="checkbox"
                              value="direccion"
                              id="colDir"
                            /><label class="form-check-label" for="colDir"
                              >Dirección</label
                            >
                          </div>
                        </div>
                      </div>

                      <h6 class="mb-3 border-bottom pb-2">Ordenamiento</h6>
                      <div class="row g-2">
                        <div class="col-md-6">
                          <label class="form-label small">Ordenar por:</label>
                          <select
                            class="form-select form-select-sm"
                            id="reporteOrderBy"
                          >
                            <option value="razon_social">
                              Alfabético (Razón Social)
                            </option>
                            <option value="rif">RIF</option>
                            <option value="created_at">
                              Fecha de Registro
                            </option>
                          </select>
                        </div>
                        <div class="col-md-6">
                          <label class="form-label small">Sentido:</label>
                          <select
                            class="form-select form-select-sm"
                            id="reporteOrderDir"
                          >
                            <option value="ASC">Ascendente (A-Z)</option>
                            <option value="DESC">Descendente (Z-A)</option>
                          </select>
                        </div>
                      </div>
                    </form>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Cancelar
                    </button>
                    <button
                      type="button"
                      class="btn btn-success"
                      id="btnGenerarExcelModal"
                    >
                      <i class="fas fa-file-excel me-2"></i>Exportar Excel
                    </button>
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="btnGenerarPDF"
                    >
                      <i class="fas fa-file-pdf me-2"></i>Generar PDF
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Custom JS -->
    <script src="sidebar.js"></script>
    <script src="proveedores.js"></script>
  </body>
</html>
