<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventario - Ferretería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js"></script>
  </head>
  <body class="bg-light">
    <div id="wrapper">
      <div id="sidebar-container"></div>
      <div id="page-content-wrapper">
        <div class="container-fluid content-offset">
          <main>
            <h1 class="mb-4 text-center">
              <i class="fas fa-boxes me-2"></i>Módulo de Inventario
            </h1>

            <!-- Panel de Filtros -->
            <div class="card shadow-sm mb-4">
              <div class="card-header bg-primary text-white">
                <i class="fas fa-filter me-2"></i>Configurar Reporte de Inventario
              </div>
              <div class="card-body">
                <div class="row g-3 align-items-end">
                  <!-- Depósito -->
                  <div class="col-md-3">
                    <label for="selectDeposito" class="form-label fw-bold">
                      <i class="fas fa-warehouse me-1"></i>Depósito
                    </label>
                    <select class="form-select" id="selectDeposito">
                      <option value="todos">Todos los depósitos</option>
                      <option value="1" selected>Depósito Principal (Venta)</option>
                      <option value="2">Mercancía Dañada</option>
                      <option value="3">Inmovilizado / Cuarentena</option>
                    </select>
                  </div>

                  <!-- Categoría -->
                  <div class="col-md-3">
                    <label for="selectCategoria" class="form-label fw-bold">
                      <i class="fas fa-tags me-1"></i>Categoría
                    </label>
                    <select class="form-select" id="selectCategoria">
                      <option value="">Todas las categorías</option>
                    </select>
                  </div>

                  <!-- Ordenar por -->
                  <div class="col-md-3">
                    <label for="selectOrdenar" class="form-label fw-bold">
                      <i class="fas fa-sort me-1"></i>Ordenar por
                    </label>
                    <select class="form-select" id="selectOrdenar">
                      <option value="nombre">Nombre (Alfabético)</option>
                      <option value="codigo">Código / N° de Parte</option>
                      <option value="precio_venta">Precio de Venta</option>
                      <option value="precio_costo">Precio de Costo</option>
                      <option value="categoria">Categoría</option>
                      <option value="stock">Stock</option>
                    </select>
                  </div>

                  <!-- Dirección -->
                  <div class="col-md-3">
                    <label for="selectDireccion" class="form-label fw-bold">
                      <i class="fas fa-arrows-alt-v me-1"></i>Dirección
                    </label>
                    <select class="form-select" id="selectDireccion">
                      <option value="ASC">↑ Ascendente (A→Z / 0→9)</option>
                      <option value="DESC">↓ Descendente (Z→A / 9→0)</option>
                    </select>
                  </div>
                </div>

                <!-- Opciones de columnas y botones -->
                <div class="row mt-3 align-items-center">
                  <!-- Checkboxes de columnas opcionales -->
                  <div class="col-md-7 d-flex flex-wrap gap-4">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="chkDescripcion" />
                      <label class="form-check-label" for="chkDescripcion">
                        <i class="fas fa-align-left me-1"></i>Incluir Descripción
                      </label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="chkConteoFisico" />
                      <label class="form-check-label" for="chkConteoFisico">
                        <i class="fas fa-clipboard-check me-1"></i>Incluir Conteo Físico
                      </label>
                    </div>
                    <!-- ★ CHECKBOX NUEVO: Mostrar Ubicación -->
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="chkUbicacion" />
                      <label class="form-check-label" for="chkUbicacion">
                        <i class="fas fa-map-marker-alt me-1 text-primary"></i>Mostrar Ubicación
                      </label>
                    </div>
                  </div>
                  <!-- Botones de acción -->
                  <div class="col-md-5 d-flex justify-content-end gap-2 flex-wrap">
                    <button class="btn btn-primary" id="btnConsultar" type="button">
                      <i class="fas fa-search me-1"></i>Consultar
                    </button>
                    <button class="btn btn-danger" id="btnGenerarPDF" type="button" disabled>
                      <i class="fas fa-file-pdf me-1"></i>Generar PDF
                    </button>
                    <button class="btn btn-success" id="btnExportarExcel" type="button" disabled>
                      <i class="fas fa-file-excel me-1"></i>Exportar a Excel
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Tabla de resultados -->
            <div class="card shadow-sm">
              <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <span><i class="fas fa-table me-2"></i>Resultados del Inventario</span>
                <span class="badge bg-light text-dark" id="badgeTotal">0 productos</span>
              </div>
              <div class="card-body p-0">
                <div class="table-responsive">
                  <table class="table table-hover table-striped mb-0">
                    <thead class="table-dark" id="theadInventario">
                      <tr>
                        <th>Código</th>
                        <th>Producto</th>
                        <th>Categoría</th>
                        <th>P. Venta ($)</th>
                        <th>P. Costo ($)</th>
                        <th>Stock</th>
                      </tr>
                    </thead>
                    <tbody id="tbodyInventario">
                      <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                          <i class="fas fa-info-circle me-1"></i>Seleccione los filtros y presione
                          <strong>Consultar</strong> para ver los productos.
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="sidebar.js"></script>
    <script src="inventario.js"></script>
  </body>
</html>
