<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Usuarios - Ferretería</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js"></script>
  </head>
  <body class="bg-light">
    <div id="wrapper">
      <!-- Sidebar -->
      <nav id="sidebar" class="sidebar">
        <div class="sidebar-heading">
          <div class="logo-container">
            <img src="img/logo.png" alt="Logo" />
          </div>
        </div>
        <div class="list-group list-group-flush">
          <a
            href="dashboard.html"
            class="list-group-item list-group-item-action"
          >
            <i class="fas fa-home me-2"></i>Dashboard
          </a>
          <a
            href="inventario.html"
            class="list-group-item list-group-item-action"
          >
            <i class="fas fa-boxes me-2"></i>Inventario
          </a>
          <a
            href="#ventasSubmenu"
            data-bs-toggle="collapse"
            class="list-group-item list-group-item-action ventas-dropdown-toggle"
          >
            <i class="fas fa-shopping-cart me-2"></i>Ventas
            <i class="fas fa-chevron-down float-end"></i>
          </a>
          <div class="collapse" id="ventasSubmenu">
            <a
              href="ventas.html"
              class="list-group-item list-group-item-action sub-item"
              ><i class="fas fa-cash-register me-2"></i>Facturación</a
            >
            <a
              href="gestion-ventas.html"
              class="list-group-item list-group-item-action sub-item"
              ><i class="fas fa-history me-2"></i>Historial y Devoluciones</a
            >
            <a
              href="caja.html"
              class="list-group-item list-group-item-action sub-item"
              ><i class="fas fa-cash-register me-2"></i>Cierre de Caja</a
            >
            <a
              href="presupuestos.html"
              class="list-group-item list-group-item-action sub-item"
              ><i class="fas fa-file-alt me-2"></i>Presupuestos</a
            >
          </div>
          <a
            href="clientes.html"
            class="list-group-item list-group-item-action"
          >
            <i class="fas fa-users me-2"></i>Clientes
          </a>
          <a
            href="productos.html"
            class="list-group-item list-group-item-action"
          >
            <i class="fas fa-box me-2"></i>Productos
          </a>
          <a
            href="usuarios.html"
            id="nav-usuarios"
            class="list-group-item list-group-item-action active"
          >
            <i class="fas fa-user-cog me-2"></i>Gestión de Usuarios
          </a>
        </div>

        <a
          href="#"
          id="btnCerrarSesion"
          class="list-group-item list-group-item-action"
        >
          <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
        </a>
      </nav>

      <!-- Page Content -->
      <div id="page-content-wrapper">
        <div class="container-fluid content-offset">
          <main>
            <h1 class="mb-4 text-center">Gestión de Usuarios</h1>

            <div class="card shadow-sm mb-4">
              <div
                class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
              >
                <h5 class="mb-0">Listado de Usuarios</h5>
                <button
                  type="button"
                  class="btn btn-light btn-sm"
                  id="btnNuevoUsuario"
                >
                  <i class="fas fa-plus me-2"></i>Nuevo Usuario
                </button>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover table-striped">
                    <thead class="table-dark">
                      <tr>
                        <th>Nombre</th>
                        <th>Usuario</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                      </tr>
                    </thead>
                    <tbody id="tablaUsuarios">
                      <!-- Aquí se cargarán los usuarios -->
                      <tr>
                        <td colspan="4" class="text-center">
                          Cargando usuarios...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="sidebar.js"></script>
    <script src="usuarios.js"></script>
  </body>
</html>
